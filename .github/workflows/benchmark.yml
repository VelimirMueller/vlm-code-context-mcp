name: Benchmark

# On-demand benchmarks only — never a schedule (test/bench-guard.test.ts).
# kind=simulated runs the token-cost simulation; kind=agent runs a real
# OpenCode session against the fixture (glm or deepseek) and cleanly skips
# when the matching API key secret is not configured.
#
# Two jobs, separated so the untrusted agent code never shares a runner with
# publish credentials:
#   - run:     contents: read only, checkout without persisted credentials,
#              agent secrets scoped to the single agent step. Uploads the run
#              JSON as an artifact.
#   - publish: contents: write + actions: write, downloads the artifact,
#              commits data/ to bench-results and dispatches pages.yml. It
#              never runs agent code and never sees provider secrets.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Which benchmark to run
        type: choice
        options: [simulated, agent]
        default: simulated
      provider:
        description: Agent provider (kind=agent only)
        type: choice
        options: [glm, deepseek]
        default: glm

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.decide.outputs.should_publish }}
    steps:
      - name: Check out main (no persisted credentials)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Run simulated benchmark
        if: inputs.kind == 'simulated'
        id: simulated
        run: |
          npm run bench
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Run agent benchmark (clean skip without the key secret)
        if: inputs.kind == 'agent'
        id: agent
        shell: bash
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          case "${{ inputs.provider }}" in
            glm)      KEY_NAME=ZAI_API_KEY ;;
            deepseek) KEY_NAME=DEEPSEEK_API_KEY ;;
            *)        echo "::error::unknown provider '${{ inputs.provider }}'"; exit 1 ;;
          esac
          if [ -z "${!KEY_NAME}" ]; then
            echo "::notice::${{ inputs.provider }} API key secret missing — agent benchmark skipped"
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run bench:live -- --provider "${{ inputs.provider }}"
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: decide
        run: |
          if [ "${{ inputs.kind }}" = "simulated" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.agent.outputs.ran }}" = "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload run data
        if: steps.decide.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bench-data
          path: data/runs
          if-no-files-found: error

  publish:
    needs: run
    if: needs.run.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out main (persisted credentials for push)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Download run data
        uses: actions/download-artifact@v4
        with:
          name: bench-data
          path: data/runs

      - name: Publish run data to bench-results
        run: npm run bench:publish

      - name: Rebuild the Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
